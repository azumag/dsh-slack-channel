# DSH patch overlay reference: mount the Slack channel plugin.
#
# Run with one of:
#
#   pnpm dsh web --patch /absolute/path/to/this/cordis.patch.yml
#   pnpm dsh --profile headless --patch /absolute/path/to/this/cordis.patch.yml
#
# Replace /absolute/path/to/dsh-slack-channel with your checkout path, or
# install the plugin into a profile with `dsh plugin add` and reference it by
# package name.
#
# Slack app prerequisites: Socket Mode enabled, Interactivity enabled (the
# approval/question buttons; the !allow / !deny / !answer text fallbacks work
# without it), bot events message.channels / message.groups / message.im
# subscribed, scopes chat:write + history + reactions:write, bot invited to
# the target channels.
#
# Security: the allowlist below denies every channel by default. A bot token
# is a credential — whoever can post into a served channel can drive a full
# agent with shell tools.

- insert:
    - id: slack-channel
      name: /absolute/path/to/dsh-slack-channel/src/index.js
      inject: [agents]
      config:
        botToken: !!js process.env.SLACK_BOT_TOKEN
        appToken: !!js process.env.SLACK_APP_TOKEN
        # Agent route for the per-channel sessions this plugin creates.
        # provider: deepseek-official
        # model: deepseek-chat
        # Workspace root for created agents (default: the server's cwd).
        # cwd: /Users/you/work
        # Per-channel workspace overrides — agree with a Slack sidebar
        # section (channels grouped per project): each listed channel's
        # sessions work in that section's workspace.
        # channelCwd:
        #   'C0123456789': /Users/you/work/project-a
        # Permission preset applied to freshly created sessions — the same
        # named table the web UI's preset switcher offers.
        # permissionPreset: workspace-write
        # Agent preset mounted into each channel session (fresh and resumed) —
        # the same composition table the web UI's preset switcher lists. The
        # preset is what supplies bash/read/grep and the rest of its tools; an
        # unset value leaves a channel session with the profile's own plugins
        # only, so it cannot read repository files or run commands.
        # agentPreset: standard
        # Channel authorization: deny by default, then allow specific ids.
        allowedChannelIds: []
        # allowAllChannels: true         # explicit escape hatch
        # notifyUnauthorized: false      # reply "not authorized" to strangers
        # Conversation continuity across restarts:
        # stateFile: ~/.dsh-slack-channel-state.json
        # Enrollment flow alternative to editing this file: set a one-time
        # secret, then post "/pair <secret>" in the target channel.
        # pairToken: change-me-before-use
        # UX knobs (defaults shown):
        # replyMode: last          # send the final assistant message of a turn
        # threadReplies: true      # reply in-thread on the originating message
        # maxReplyChars: 4000      # split longer replies into chunks
        # ackReaction: hourglass   # "working" emoji; '' disables
        # mentionOnly: false       # serve only messages that address the bot
        #                          # (DMs are never gated); gated messages are
        #                          # kept and handed to the next addressed turn
        # contextMessages: 20      # how many unseen messages that turn carries
        # How long an interactive prompt waits in the channel. Approvals and
        # ask_user_question calls are posted with buttons; whatever nobody
        # answers is settled at this deadline (an approval fails closed, a
        # question reports the timeout to the model), so a channel is never
        # left blocked. 0 waits until the turn is stopped instead.
        # interactiveTimeoutMs: 1800000   # 30 minutes
        # Mentions the agent's own text may turn into a real Slack mention.
        # Reply text is escaped (nothing can become a link or a ping by
        # accident), which also escapes "<@U...>": only ids listed here come
        # back as mentions. Empty (the default) keeps every agent-written
        # mention as text; the automatic mention-back to the message's author
        # still works either way.
        # mentionUserIds:
        #   - U0C7AN52QGN
        #   - U0C6HEG8KC6
